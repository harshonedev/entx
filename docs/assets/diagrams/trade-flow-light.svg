<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d"><title id="t">One trade, end to end</title><desc id="d">A trade is quoted by the AMM and filled in the browser store. If a wallet is connected with receipts on, a Solana memo transaction is sent first, then NEAR record_trade carrying the Solana signature as chain_ref. If the Solana step fails, the NEAR step is skipped.</desc><defs><marker id="m0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker><marker id="m0s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#141414"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f5a4f"/></marker><marker id="m1s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#5f5a4f"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b4fd0"/></marker><marker id="m2s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#6b4fd0"/></marker><marker id="m3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b746f"/></marker><marker id="m3s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0b746f"/></marker></defs><rect width="1000" height="470" fill="#f4f1ea"/><text x="32" y="46" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#141414" letter-spacing="0.03em">ONE TRADE, END TO END</text><text x="968" y="44" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5f5a4f" text-anchor="end" font-style="italic">every fill is local; receipts are opt-in</text><rect x="32" y="60" width="936" height="3" rx="0" fill="#b81f19"/><rect x="32" y="66" width="936" height="1" rx="0" fill="#141414"/><text x="32" y="104" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5f5a4f" letter-spacing="0.08em">IN THE BROWSER · INSTANT</text><rect x="32" y="120" width="190" height="96" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><circle cx="56" cy="146" r="13" fill="#b81f19"/><text x="56" y="151" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="78" y="152" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#141414" letter-spacing="0.03em">TRADE PANEL</text><text x="48" y="182" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#141414">Buy $25 of a title</text><path d="M228 168 H241" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="247" y="120" width="190" height="96" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><circle cx="271" cy="146" r="13" fill="#b81f19"/><text x="271" y="151" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="293" y="152" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#141414" letter-spacing="0.03em">ENGINE.TS</text><text x="263" y="182" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#141414">AMM quote, 0.3% fee</text><path d="M443 168 H456" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="462" y="120" width="190" height="96" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><circle cx="486" cy="146" r="13" fill="#b81f19"/><text x="486" y="151" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="508" y="152" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#141414" letter-spacing="0.03em">STORE FILL</text><text x="478" y="182" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#141414">position, trade, candle</text><text x="478" y="202" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5f5a4f">→ localStorage</text><path d="M628 168 H716" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><path d="M790 114 L864 168 L790 222 L716 168 Z" fill="#ebe6da" stroke="#141414" stroke-width="1.5"/><text x="790" y="162" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#141414" text-anchor="middle">Wallet connected</text><text x="790" y="181" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#141414" text-anchor="middle">+ receipts on?</text><path d="M864 168 H908" fill="none" stroke="#5f5a4f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1)"/><text x="872" y="160" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#5f5a4f" letter-spacing="0.08em">NO</text><text x="912" y="164" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#141414">Done.</text><text x="912" y="182" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5f5a4f">simulated</text><text x="798" y="254" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#5f5a4f" letter-spacing="0.08em">YES</text><path d="M790 222 V264 Q790 274 780 274 H130 Q120 274 120 284 V300" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><text x="32" y="262" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5f5a4f" letter-spacing="0.08em">ON CHAIN · RECEIPTS.TS, SEQUENTIAL</text><rect x="32" y="300" width="280" height="130" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="32" y="300" width="280" height="130" rx="6" fill="#6b4fd0" fill-opacity="0.07"/><path d="M38 300 H306 A6 6 0 0 1 312 306 V304 H32 V306 A6 6 0 0 1 38 300 Z" fill="#6b4fd0"/><text x="46" y="328" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#6b4fd0" letter-spacing="0.03em">SOLANA DEVNET</text><circle cx="288" cy="324" r="13" fill="#6b4fd0"/><text x="288" y="329" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="46" y="358" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#141414">SPL Memo tx, user signs</text><text x="46" y="380" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#5f5a4f">returns a signature</text><text x="46" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#6b4fd0">5Hk…q9  (example)</text><rect x="372" y="300" width="360" height="130" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="372" y="300" width="360" height="130" rx="6" fill="#0b746f" fill-opacity="0.07"/><path d="M378 300 H726 A6 6 0 0 1 732 306 V304 H372 V306 A6 6 0 0 1 378 300 Z" fill="#0b746f"/><text x="386" y="328" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0b746f" letter-spacing="0.03em">NEAR RECORD_TRADE</text><circle cx="708" cy="324" r="13" fill="#0b746f"/><text x="708" y="329" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="386" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#0b746f">chain_ref = "solana:devnet:&lt;sig&gt;"</text><text x="386" y="384" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#141414">caller pays storage, excess refunded</text><text x="386" y="406" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#5f5a4f">notarised claim, not settled volume</text><rect x="792" y="300" width="176" height="130" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><path d="M798 300 H962 A6 6 0 0 1 968 306 V304 H792 V306 A6 6 0 0 1 798 300 Z" fill="#141414"/><text x="806" y="328" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">/ONCHAIN</text><circle cx="944" cy="324" r="13" fill="#141414"/><text x="944" y="329" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="806" y="358" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#5f5a4f">reads</text><text x="806" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="500" fill="#141414">get_recent_receipts</text><text x="806" y="406" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5f5a4f">every 15 s</text><path d="M318 365 H366" fill="none" stroke="#6b4fd0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m2)"/><text x="342" y="355" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6b4fd0" text-anchor="middle">sig</text><path d="M738 365 H786" fill="none" stroke="#0b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#m3)"/><circle cx="342" cy="392" r="11" fill="#b81f19"/><text x="342" y="397" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">×</text><text x="32" y="460" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#b81f19">If step 4 fails, step 5 is skipped, so a NEAR receipt never points at a missing Solana signature.</text></svg>
