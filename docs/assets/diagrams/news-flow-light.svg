<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d"><title id="t">One news event, end to end</title><desc id="d">A news button fires a catalogue event. The browser applies it instantly to the app EPI and price. In parallel, /api/oracle authenticates, rate-limits, clamps the value to within 15 of the seeded baseline and signs report_epi with a function-call key, landing in a 32-slot trusted ring on NEAR. /onchain shows both EPIs side by side.</desc><defs><marker id="m0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker><marker id="m0s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#141414"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b81f19"/></marker><marker id="m1s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#b81f19"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b746f"/></marker><marker id="m2s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0b746f"/></marker></defs><rect width="1000" height="520" fill="#f4f1ea"/><text x="32" y="46" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#141414" letter-spacing="0.03em">ONE NEWS EVENT, END TO END</text><text x="968" y="44" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5f5a4f" text-anchor="end" font-style="italic">two EPIs on purpose: the app's and the oracle's</text><rect x="32" y="60" width="936" height="3" rx="0" fill="#b81f19"/><rect x="32" y="66" width="936" height="1" rx="0" fill="#141414"/><rect x="32" y="210" width="150" height="110" rx="8" fill="#b81f19"/><text x="107" y="244" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.03em">NEWS BUTTON</text><text x="107" y="270" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="middle">box-office beat,</text><text x="107" y="288" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="middle">trailer, award…</text><text x="107" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">{assetId, eventId}</text><path d="M182 250 H200 Q210 250 210 240 V140 Q210 130 220 130 H236" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="240" y="92" width="728" height="86" rx="8" fill="#ebe6da" stroke="#bdb5a4" stroke-width="1"/><text x="256" y="114" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5f5a4f" letter-spacing="0.08em">APP · THIS BROWSER · INSTANT</text><rect x="256" y="128" width="154.08" height="24" rx="12" fill="#141414" fill-opacity="0.1" stroke="#141414" stroke-width="1"/><text x="333.04" y="144.5" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#141414" text-anchor="middle">apply event deltas</text><path d="M416.08000000000004 140 H438.08000000000004" fill="none" stroke="#141414" stroke-width=