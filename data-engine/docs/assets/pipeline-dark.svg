nt-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#ece6d8">Sacnilk</text><rect x="240" y="377" width="61.120000000000005" height="24" rx="12" fill="#f45a4a" fill-opacity="0.1" stroke="#f45a4a" stroke-width="1"/><text x="270.56" y="393.5" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f45a4a" text-anchor="middle">scraped</text><path d="M322 389 H352" fill="none" stroke="#504b41" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="358" y="96" width="330" height="330" rx="6" fill="#1b1a17" stroke="#504b41" stroke-width="1"/><rect x="358" y="96" width="330" height="330" rx="6" fill="#f45a4a" fill-opacity="0.05"/><path d="M364 96 H682 A6 6 0 0 1 688 102 V100 H358 V102 A6 6 0 0 1 364 96 Z" fill="#f45a4a"/><text x="372" y="124" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#f45a4a" letter-spacing="0.03em">ENTX-DATA-ENGINE</text><text x="676" y="122" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#a69f90" text-anchor="end" letter-spacing="0.08em">THIS SERVICE</text><rect x="374" y="140" width="298" height="54" rx="6" fill="#24221e" stroke="#35322c" stroke-width="1"/><text x="388" y="163" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#ece6d8" letter-spacing="0.03em">SCHEDULER</text><text x="388" y="182" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">croner · UTC cron · advisory lock per job</text><path d="M523 194 V206" fill="none" stroke="#504b41" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="206" width="298" height="54" rx="6" fill="#24221e" stroke="#35322c" stroke-width="1"/><text x="388" y="229" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#ece6d8" letter-spacing="0.03em">COLLECTORS</text><text x="388" y="248" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">7 jobs · plan → fetch → snapshot</text><path d="M523 260 V272" fill="none" stroke="#504b41" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="272" width="298" height="54" rx="6" fill="#24221e" stroke="#35322c" stroke-width="1"/><text x="388" y="295" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#ece6d8" letter-spacing="0.03em">POLITE FETCH</text><text x="388" y="314" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">UA · rate per host · robots · retry · timeout</text><path d="M523 326 V338" fill="none" stroke="#504b41" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="338" width="298" height="54" rx="6" fill="#24221e" stroke="#35322c" stroke-width="1"/><text x="388" y="361" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#ece6d8" letter-spacing="0.03em">DISCOVERY</text><text x="388" y="380" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">title_links · discovered_items</text><text x="374" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#a69f90">bun data-engine/main.ts · /health :8080</text><path d="M688 260 H720" fill="none" stroke="#f45a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1)"/><rect x="726" y="96" width="242" height="330" rx="6" fill="#1b1a17" stroke="#504b41" stroke-width="1"/><path d="M732 96 H962 A6 6 0 0 1 968 102 V100 H726 V102 A6 6 0 0 1 732 96 Z" fill="#ece6d8"/><text x="740" y="124" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#ece6d8" letter-spacing="0.03em">POSTGRES</text><text x="956" y="122" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#a69f90" text-anchor="end" letter-spacing="0.08em">EVIDENCE STORE</text><text x="742" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#ece6d8">snapshots</text><text x="742" y="168" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">immutable · sha256 · gzip</text><text x="742" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#ece6d8">tracked_titles</text><text x="742" y="222" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">market · watch · cohort</text><text x="742" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#ece6d8">title_links</text><text x="742" y="276" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a69f90">imdb · wikidata · wiki:*</text><text x="742" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#ece6d8">discovered_items</text><tex