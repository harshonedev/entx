hivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a69f90">phase 3 · read-only on evidence</text><path d="M468 520 H508" fill="none" stroke="#504b41" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m0)"/><rect x="512" y="488" width="196" height="64" rx="6" fill="#1b1a17" stroke="#504b41" stroke-width="1" stroke-dasharray="5 4"/><text x="526" y="514" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#a69f90" letter-spacing="0.03em">EPI MODELS</text><text x="526" y="536" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a69f90">phase 4 · theatrical · streaming · series</text><path d="M708 520 H748" fill="none" stroke="#504b41" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m0)"/><rect x="772" y="488" width="196" height="64" rx="6" fill="#1b1a17" stroke="#504b41" stroke-width="1" stroke-dasharray="5 4"/><text x="786" y="514" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#a69f90" letter-spacing="0.03em">LIVE APP + ORACLE</text><text x="786" y="536" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a69f90">phase 6</text><text x="32" y="600" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a69f90" font-style="italic">Every fetch is stored as raw evidence before anything reads it. Nothing is parsed, matched or scored in phase 1.</text></svg>
