<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d"><title id="t">EPI data engine</title><desc id="d">Six sources (four documented APIs, one published Netflix dataset, one scraped site) feed the entx-data-engine worker: a scheduler runs seven collectors through a polite fetch layer and stores every response as an immutable snapshot in Postgres, alongside tracked titles, discovered links and job runs. Normalizer, trust engine, EPI models and the live app are later phases.</desc><defs><marker id="m0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#504b41"/></marker><marker id="m0s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#504b41"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f45a4a"/></marker><marker id="m1s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#f45a4a"/></marker></defs><rect width="1000" height="640" fill="#12110f"/><text x="32" y="46" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#ece6d8" letter-spacing="0.03em">DATA ENGINE</text><text x="968" y="44" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a69f90" text-anchor="end" font-style="italic">evidence first · trust later · score last</text><rect x="32" y="60" width="936" height="3" rx="0" fill="#f45a4a"/><rect x="32" y="66" width="936" height="1" rx="0" fill="#ece6d8"/><text x="32" y="104" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#a6