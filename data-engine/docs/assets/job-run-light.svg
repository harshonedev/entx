<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img" aria-labelledby="t d"><title id="t">One job run</title><desc id="d">A collector run takes a Postgres advisory lock for its job, plans its requests, fetches each through the polite fetch layer (robots for scraped hosts, per-host spacing, timeout, retry with backoff), stores every response as an immutable snapshot, records discovered links, and writes the outcome to job_runs: ok, degraded, failed, skipped_locked or abandoned.</desc><defs><marker id="m0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bdb5a4"/></marker><marker id="m0s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#bdb5a4"/></marker></defs><rect width="1000" height="548" fill="#f4f1ea"/><text x="32" y="46" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#141414" letter-spacing="0.03em">ONE JOB RUN</text><text x="968" y="44" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5f5a4f" text-anchor="end" font-style="italic">what happens every time a collector fires</text><rect x="32" y="60" width="936" height="3" rx="0" fill="#b81f19"/><rect x="32" y="66" width="936" height="1" rx="0" fill="#141414"/><rect x="32" y="96" width="296" height="104" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="32" y="96" width="296" height="4" rx="0" fill="#141414"/><circle cx="58" cy="128" r="13" fill="#141414"/><text x="58" y="133" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="80" y="134" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">LOCK</text><text x="48" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#141414">pg_try_advisory_lock(job)</text><text x="48" y="185" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f5a4f">held? → skipped_locked</text><path d="M330 148.0 H348" fill="none" stroke="#bdb5a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="350" y="96" width="296" height="104" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="350" y="96" width="296" height="4" rx="0" fill="#141414"/><circle cx="376" cy="128" r="13" fill="#141414"/><text x="376" y="133" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="398" y="134" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">PLAN</text><text x="366" y="164" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">which titles / files / pages</text><text x="366" y="185" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f5a4f">role, range, last snapshot age</text><path d="M648 148.0 H666" fill="none" stroke="#bdb5a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="668" y="96" width="296" height="104" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="668" y="96" width="296" height="4" rx="0" fill="#0b746f"/><circle cx="694" cy="128" r="13" fill="#0b746f"/><text x="694" y="133" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="716" y="134" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">FETCH</text><text x="684" y="164" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">polite fetch per request</text><text x="684" y="185" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f5a4f">robots · spacing · timeout</text><rect x="32" y="240" width="296" height="104" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="32" y="240" width="296" height="4" rx="0" fill="#b81f19"/><circle cx="58" cy="272" r="13" fill="#b81f19"/><text x="58" y="277" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="80" y="278" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">STORE</text><text x="48" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#141414">recordSnapshot()</text><text x="48" y="329" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f5a4f">sha256 · gzip · retention</text><path d="M330 292.0 H348" fill="none" stroke="#bdb5a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="350" y="240" width="296" height="104" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="350" y="240" width="296" height="4" rx="0" fill="#141414"/><circle cx="376" cy="272" r="13" fill="#141414"/><text x="376" y="277" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="398" y="278" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">DISCOVER</text><text x="366" y="308" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">links + film pages</text><text x="366" y="329" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f5a4f">title_links · discovered_items</text><path d="M648 292.0 H666" fill="none" stroke="#bdb5a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><rect x="668" y="240" width="296" height="104" rx="6" fill="#fbfaf6" stroke="#bdb5a4" stroke-width="1"/><rect x="668" y="240" width="296" height="4" rx="0" fill="#1d7446"/><circle cx="694" cy="272" r="13" fill="#1d7446"/><text x="694" y="277" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="716" y="278" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#141414" letter-spacing="0.03em">RECORD</text><text x="684" y="308" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">job_runs row</text><text x="684" y="329" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f5a4f">ok · degraded · failed</text><path d="M816.0 200 V220 H180.0 V238" fill="none" stroke="#bdb5a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/><text x="952" y="84" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0b746f" text-anchor="end">429 / 503 / network error / timeout → retry, max 3</text><text x="32" y="384" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5f5a4f" letter-spacing="0.08em">OUTCOMES</text><rect x="32" y="398" width="33.5" height="24" rx="12" fill="#1d7446"/><text x="48.75" y="414.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">ok</text><text x="182" y="415" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">everything fetched and stored</text><rect x="32" y="424" width="80.0" height="24" rx="12" fill="#8f5a00" fill-opacity="0.1" stroke="#8f5a00" stroke-width="1"/><text x="72.0" y="440.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#8f5a00" text-anchor="middle">degraded</text><text x="182" y="441" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">stored what it could: 404s, 0 links found, bad header</text><rect x="32" y="450" width="64.5" height="24" rx="12" fill="#b81f19" fill-opacity="0.1" stroke="#b81f19" stroke-width="1"/><text x="64.25" y="466.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#b81f19" text-anchor="middle">failed</text><text x="182" y="467" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">threw: message saved in job_runs.detail</text><rect x="32" y="476" width="126.5" height="24" rx="12" fill="#5f5a4f" fill-opacity="0.1" stroke="#5f5a4f" stroke-width="1"/><text x="95.25" y="492.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#5f5a4f" text-anchor="middle">skipped_locked</text><text x="182" y="493" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">same job already running elsewhere</text><rect x="32" y="502" width="87.75" height="24" rx="12" fill="#5f5a4f" fill-opacity="0.1" stroke="#5f5a4f" stroke-width="1"/><text x="75.875" y="518.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#5f5a4f" text-anchor="middle">abandoned</text><text x="182" y="519" font-family="Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#141414">left running by a dead container, set on start</text></svg>
